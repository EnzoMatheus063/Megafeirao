<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>produto</title>

    <link rel="stylesheet" href="/style/produto.css">
    <!--logo da empresa para o navegador-->
    <link rel="icon" type="image/png" href="/assets/logo-navegador.png">

</head>

<body>
    </head>

    <body>
        <!-- CABECALHO-->


        <header>
            <div class="topo">
                <!-- LOGO -->
                <div class="logo">
                    <img src="/assets/logo.png" alt="Logo do Mega feirao">
                    <h1> Mega feirao </h1>
                </div>

                <!-- caixa de pesquisa-->

                <div class="caixa-pesquisa">
                    <img src="/assets/lupa.png" alt="Lupa de pesquisa">
                    <input type="  text   " placeholder="   O que você está procurando?  ">
                    <button>Buscar</button>

                </div>
                <!-- icones -->

                <div class="icones">
                    <a href="#"><img src="/assets/usuario.png" alt="Ícone de usuário"></a>
                    <small> Olá visitante</small>
                    <p>Entrar</p>

                    <a href="#"><img src="/assets/carrinho.png" alt="Ícone de carrinho"></a>
                    <small>Meu </small>
                    <p>Carrinho</p>
                </div>

            </div>
            <!-- MENU DE NAVEGAÇÃO-->
            <nav class="menu">
                <a id="id-ofertas-semana" href="#">Ofertas da semana</a>
                <a href="#">Ofertas do dia</a>
                <a href="#">Categorias</a>
                <a href="#">detalhes do produto</a>
                <a href="#">Atendimento</a>
                <a href="#">Carrinho</a>
                <a href="#">Mais vendidos</a>
                <a href="#">Buscar</a>
                <a href="#">Inicio</a>
                <a href="#">Ajuda</a>
                <a href="#">Suporte</a>

            </nav>
        </header>

        <!--Area dos Dados do Produto-->
        <div class="area-detalhes">
            <div class="area-imagens">
                <div class="img-lateral" id="img-lateral">
                    <!-- Não criamos tag img aqui porque não temos como saber a quantidade de imgaens que o lojista vai cadastrar-->
                </div>
                <div class="img-principal" id="img-principal">
                    <img id="imagem-maior">

                </div>
            </div>



            <div class="area-textos">
                <!--nome do produto-->
                <h1 id="nome-produto"></h1>
                <!--área das avaliações do produto-->
                <div class="avaliacoes-produto">
                    <img id="estrela-avaliacao">
                    <span id="valor-avaliacao"></span>
                </div>
                <p id="preco-antigo"></p>
                <!--area do preço promocional-->
                <div class="preco-promocional">
                    <p id="preco-promocional"></p>
                    <span id="desconto"></span>

                </div>
                <div id="tamanhos"></div>
                <div id="cores"></div>
                <div class="quantidade">
                    <button id="diminuir">-</button>
                    <span id="numero-quantidade"></span>
                    <button id="aumentar">+</button>
                </div>
                <div class="btn-add-carrinho">
                    <button id="btn-add-carrinho"></button>
                </div>


                <div class="btn-comprar">
                    <button id="btn-comprar"></button>
                </div>
                <div class="area-frete">
                    <p>calcular o Frete</p>
                    <input id="frete">
                    <button id="btn-calcular-frete">calcular</button>
                </div>
        </div>

        <!-- fazendo a conexão com o Javascript-->
        <script src="/js/produto.js"></script>
    </body>

</html>

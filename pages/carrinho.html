<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Carrinho | Mega Feirão</title>

    <link rel="stylesheet"
          href="../Style/carrinho.css">

</head>

<body>

    <!-- ===========================================
                    HEADER
    ============================================ -->

    <header>

        <div class="top-header">

            <div class="logo">

                <img
                    id="logoImagem"
                    src=""
                    alt="Logo">

                <h1 id="logoTitulo"></h1>

            </div>

            <div class="pesquisa">

                <input
                    id="campoPesquisa"
                    type="text"
                    placeholder="">

            </div>

        </div>

    </header>

    <!-- ===========================================
                    MENU
    ============================================ -->

    <nav>

        <div class="menu">

            <a id="menuInicio" href="#"></a>

            <a id="menuProdutos" href="#"></a>

            <a id="menuOfertas" href="#"></a>

            <a id="menuContato" href="#"></a>

        </div>

    </nav>

    <!-- ===========================================
                    CONTEÚDO
    ============================================ -->

    <main>

        <!-- ===========================
                PRODUTOS
        ============================ -->

        <section class="carrinho">

            <div class="carrinho-info">

                <h2 id="tituloCarrinho"></h2>

                <p id="descricaoCarrinho"></p>

            </div>

            <div class="lista-produtos">

                <!-- Produto 1 -->

                <article class="produto">

                    <img
                        id="produtoImagem1"
                        src=""
                        alt="Produto">

                    <div class="produto-info">

                        <h3 id="produtoNome1"></h3>

                    </div>

                    <div class="produto-preco">

                        <p id="produtoPreco1"></p>

                        <p id="produtoQuantidade1"></p>

                        <strong id="produtoTotal1"></strong>

                    </div>

                </article>

                <!-- Produto 2 -->

                <article class="produto">

                    <img
                        id="produtoImagem2"
                        src=""
                        alt="Produto">

                    <div class="produto-info">

                        <h3 id="produtoNome2"></h3>

                    </div>

                    <div class="produto-preco">

                        <p id="produtoPreco2"></p>

                        <p id="produtoQuantidade2"></p>

                        <strong id="produtoTotal2"></strong>

                    </div>

                </article>

                <!-- Produto 3 -->

                <article class="produto">

                    <img
                        id="produtoImagem3"
                        src=""
                        alt="Produto">

                    <div class="produto-info">

                        <h3 id="produtoNome3"></h3>

                    </div>

                    <div class="produto-preco">

                        <p id="produtoPreco3"></p>

                        <p id="produtoQuantidade3"></p>

                        <strong id="produtoTotal3"></strong>

                    </div>

                </article>

            </div>

        </section>

        <!-- ===========================
                RESUMO
        ============================ -->

        <section class="resumo">

            <h2 id="tituloResumo"></h2>

            <p id="descricaoResumo"></p>

            <div class="acoes-resumo">

                <button
                    id="btnContinuar"
                    type="button">
                </button>

                <button
                    id="btnFinalizar"
                    type="button">
                </button>

            </div>

            <div class="cards-resumo">

                <article class="card-resumo">

                    <h3 id="tituloSubtotal"></h3>

                    <strong id="valorSubtotal"></strong>

                    <p id="descricaoSubtotal"></p>

                </article>

                <article class="card-resumo">

                    <h3 id="tituloDesconto"></h3>

                    <strong id="valorDesconto"></strong>

                    <p id="descricaoDesconto"></p>

                </article>

                <article class="card-resumo">

                    <h3 id="tituloFrete"></h3>

                    <strong id="valorFrete"></strong>

                    <p id="descricaoFrete"></p>

                </article>

                <article class="card-resumo">

                    <h3 id="tituloTotal"></h3>

                    <strong id="valorTotal"></strong>

                    <p id="descricaoTotal"></p>

                </article>

            </div>

        </section>
                <!-- ===========================================
                FINALIZAR COMPRA
        ============================================ -->

        <section class="checkout">

            <div class="checkout-titulo">

                <h2 id="tituloCheckout"></h2>

                <p id="descricaoCheckout"></p>

            </div>

            <form id="formCheckout">

                <div class="form-grid">

                    <!-- CEP -->

                    <div class="campo">

                        <label
                            id="lblCep"
                            for="cep">
                        </label>

                        <input
                            id="cep"
                            type="text"
                            placeholder="">

                    </div>

                    <!-- CUPOM -->

                    <div class="campo">

                        <label
                            id="lblCupom"
                            for="cupom">
                        </label>

                        <input
                            id="cupom"
                            type="text"
                            placeholder="">

                    </div>

                    <!-- PAGAMENTO -->

                    <div class="campo">

                        <label
                            id="lblPagamento"
                            for="pagamento">
                        </label>

                        <select id="pagamento">

                            <option id="pagamentoOpcao1"></option>

                            <option id="pagamentoOpcao2"></option>

                            <option id="pagamentoOpcao3"></option>

                            <option id="pagamentoOpcao4"></option>

                        </select>

                    </div>

                    <!-- ENTREGA -->

                    <div class="campo">

                        <label
                            id="lblEntrega"
                            for="entrega">
                        </label>

                        <select id="entrega">

                            <option id="entregaOpcao1"></option>

                            <option id="entregaOpcao2"></option>

                            <option id="entregaOpcao3"></option>

                        </select>

                    </div>

                </div>

                <div class="checkout-botoes">

                    <button
                        id="btnVoltarCarrinho"
                        type="button">
                    </button>

                    <button
                        id="btnConfirmarPedido"
                        type="submit">
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- ===========================================
                    FOOTER
    ============================================ -->

    <footer>

        <div class="footer-container">

            <div class="footer-item">

                <h3 id="footerTitulo1"></h3>

                <p id="footerTexto1"></p>

            </div>

            <div class="footer-item">

                <h3 id="footerTitulo2"></h3>

                <p id="footerTexto2"></p>

            </div>

            <div class="footer-item">

                <h3 id="footerTitulo3"></h3>

                <p id="footerTexto3"></p>

            </div>

        </div>

        <div class="footer-bottom">

            <p id="copyright"></p>

        </div>

    </footer>

    <script src="../js/carrinho.js"></script>

</body>

</html>

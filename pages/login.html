<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="/style/login.css">

</head>

<body>

    <!-- ===========================
            HEADER
    ============================ -->

    <header>

        <div class="top-header">

            <div class="logo">

                <img
                    id="logoImagem"
                    src=""
                    alt="Logo">

                <h1 id="logoNome"></h1>

            </div>

        </div>

    </header>

    <!-- ===========================
            MENU
    ============================ -->

    <nav>

        <div class="menu">

            <div class="menu-links">

                <a id="menu1" href="#"></a>

                <a id="menu2" href="#"></a>

                <a id="menu3" href="#"></a>

                <a id="menu4" href="#"></a>

            </div>

            <div class="busca">

                <input
                    id="campoBusca"
                    type="text"
                    placeholder="">

            </div>

        </div>

    </nav>

    <!-- ===========================
            HERO
    ============================ -->

    <section class="hero">

        <h1 id="heroTitulo"></h1>

        <p id="heroDescricao"></p>

        <div class="hero-botoes">

            <button
                id="btnCriarConta"
                type="button">
            </button>

            <button
                id="btnEntrarHero"
                type="button">
            </button>

        </div>

    </section>

    <!-- ===========================
            LOGIN
    ============================ -->

    <main>

        <section class="login-area">

            <section class="login-texto">

                <h2 id="loginTitulo"></h2>

                <p id="loginDescricao"></p>

            </section>

            <section class="login-formulario">

                <form id="form-login">

                    <div class="campo">

                        <label
                            id="lblEmail"
                            for="email">
                        </label>

                        <input
                            id="email"
                            type="email"
                            placeholder="">

                    </div>

                    <div class="campo">

                        <label
                            id="lblSenha"
                            for="senha">
                        </label>

                        <input
                            id="senha"
                            type="password"
                            placeholder="">

                    </div>

                    <div class="botoes-form">

                        <button
                            id="btnEsqueciSenha"
                            type="button">
                        </button>

                        <button
                            id="btnEntrar"
                            type="submit">
                        </button>

                    </div>

                </form>

            </section>

        </section>

        <!-- ===========================
                OPÇÕES DE ACESSO
        ============================ -->

        <section class="acesso">

            <div class="acesso-texto">

                <h2 id="tituloAcesso"></h2>

                <p id="descricaoAcesso"></p>

            </div>

            <div class="cards-acesso">

                <!-- Card 1 -->

                <article class="card-acesso">

                    <img
                        id="card1Imagem"
                        src=""
                        alt="">

                    <div class="card-info">

                        <h3 id="card1Titulo"></h3>

                        <p id="card1Descricao"></p>

                        <span id="card1Botao"></span>

                    </div>

                </article>

                <!-- Card 2 -->

                <article class="card-acesso">

                    <img
                        id="card2Imagem"
                        src=""
                        alt="">

                    <div class="card-info">

                        <h3 id="card2Titulo"></h3>

                        <p id="card2Descricao"></p>

                        <span id="card2Botao"></span>

                    </div>

                </article>

            </div>

        </section>

        <!-- ===========================
                CADASTRO
        ============================ -->

        <section class="hero">

            <h1 id="cadastroTitulo"></h1>

            <p id="cadastroDescricao"></p>

            <div class="hero-botoes">

                <button
                    id="btnCadastrar"
                    type="button">
                </button>

            </div>

        </section>

    </main>

    <!-- ===========================
            FOOTER
    ============================ -->

    <footer>

        <div class="footer">

            <div class="footer-top">

                <div>

                    <h2 id="footerTitulo"></h2>

                    <div class="redes">

                        <a
                            id="facebook"
                            href="#">
                            📘
                        </a>

                        <a
                            id="instagram"
                            href="#">
                            📷
                        </a>

                        <a
                            id="youtube"
                            href="#">
                            ▶
                        </a>

                        <a
                            id="twitter"
                            href="#">
                            🐦
                        </a>

                    </div>

                </div>

                <div class="endereco">

                    <strong id="tituloEndereco"></strong>

                    <p id="textoEndereco"></p>

                </div>

            </div>

            <div class="footer-bottom">

                <a
                    id="footerLink1"
                    href="#">
                </a>

                <a
                    id="footerLink2"
                    href="#">
                </a>

                <a
                    id="footerLink3"
                    href="#">
                </a>

                <a
                    id="footerLink4"
                    href="#">
                </a>

            </div>

        </div>

    </footer>

    <script src="/js/login.js"></script>

</body>

</html>

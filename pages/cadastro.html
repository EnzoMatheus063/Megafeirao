<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Cadastro</title>

    <link rel="stylesheet" href="/Style/cadastro.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header id="header-container"></header>

    <!-- Navegação -->
    <nav id="menu-container"></nav>

    <!-- Conteúdo Principal -->
    <main>

        <!-- Hero -->
        <section id="hero-container"></section>

        <!-- Área Cadastro -->
        <section class="cadastro-section">

            <div class="cadastro-info">
                <h2>Cadastro do Cliente</h2>
                <p>
                    Preencha os campos abaixo para concluir seu cadastro.
                </p>
            </div>

            <div class="cadastro-form">

                <form id="form-cadastro">

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu E-mail completo"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            placeholder="Crie uma senha"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Repita a senha"
                            required>
                    </div>

                    <div class="form-buttons">
                        <button type="reset" class="btn-cancelar">
                            Cancelar
                        </button>

                        <button type="submit" class="btn-criar">
                            Criar Conta
                        </button>
                    </div>

                </form>

            </div>

        </section>

        <!-- Benefícios -->
        <section id="beneficios-container"></section>

    </main>

    <!-- Rodapé -->
    <footer id="footer-container"></footer>

    <script src="/js/cadastro.js"></script>

</body>

</html>

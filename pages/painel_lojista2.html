<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Lojista</title>

    <link rel="stylesheet" href="../Style/painel_lojista2.css">

</head>

<body>

    <!-- ==========================================================
     HEADER
========================================================== -->

    <header class="header">

        <div class="logo-area">

            <img id="logoImagem" src="" alt="Logo">

            <h1 id="logoTitulo"></h1>

        </div>

        <nav class="menu-superior">

            <a id="menuProdutos" href="#"></a>

            <a id="menuBanners" href="#"></a>

            <a id="menuPromocoes" href="#"></a>

            <a id="menuVendas" href="#"></a>

            <a id="menuConfiguracoes" href="#"></a>

        </nav>

        <div class="pesquisa">

            <input id="campoPesquisa" type="search">

        </div>

    </header>


    <!-- ==========================================================
     CONTEÚDO
========================================================== -->

    <main class="conteudo">


        <!-- ==========================================================
     TOPO
========================================================== -->

        <section class="hero">

            <h2 id="tituloHero"></h2>

            <p id="descricaoHero"></p>

            <div class="hero-botoes">

                <button id="btnRascunhos"></button>

                <button id="btnNovoCadastro"></button>

            </div>

            <div class="hero-filtros">

                <button id="btnFiltroProdutos"></button>

                <button id="btnFiltroBanners"></button>

                <button id="btnFiltroPromocoes"></button>

            </div>

        </section>


        <!-- ==========================================================
     CADASTRO DE PRODUTO
========================================================== -->

        <section class="cadastro-produto">

            <div class="titulo-secao">

                <div>

                    <h2 id="tituloCadastroProduto"></h2>

                    <p id="descricaoCadastroProduto"></p>

                </div>

                <img id="imagemCadastroProduto" src="" alt="Produto">

            </div>


            <form id="formProduto">

                <div class="grid-form">


                    <div class="campo">

                        <label id="lblNomeProduto" for="nomeProduto">
                        </label>

                        <input id="nomeProduto" name="nome" type="text" required>

                    </div>


                    <div class="campo">

                        <label id="lblSku" for="skuProduto">
                        </label>

                        <input id="skuProduto" name="codigo" type="text" required>

                    </div>


                    <div class="campo">

                        <label id="lblCategoria" for="categoriaProduto">
                        </label>

                        <select id="categoriaProduto" name="Categoria_idCategoria" required>

                            <option value="">
                                Selecione...
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label id="lblPreco" for="precoProduto">
                        </label>

                        <input id="precoProduto" name="preco" type="number" min="0" step="0.01" required>

                    </div>


                    <div class="campo">

                        <label id="lblPrecoPromo" for="precoPromocional">
                        </label>

                        <input id="precoPromocional" name="preco_promocional" type="number" min="0" step="0.01">

                    </div>


                    <div class="campo">

                        <label id="lblEstoque" for="estoqueProduto">
                        </label>

                        <input id="estoqueProduto" name="estoque" type="number" min="0" step="1" required>

                    </div>


                    <div class="campo">

                        <label id="lblDescricaoCurta" for="descricaoCurta">
                        </label>

                        <input id="descricaoCurta" name="descricao" type="text">

                    </div>


                    <div class="campo">

                        <label id="lblImagemProduto" for="imagemProduto">
                        </label>

                        <input id="imagemProduto" name="imagem" type="file" accept="image/*">

                    </div>

                </div>


                <div class="acoes-formulario">

                    <button id="btnSalvarRascunhoProduto" type="button">
                    </button>

                    <button id="btnSalvarProduto" type="submit">
                    </button>

                </div>

            </form>

        </section>


        <!-- ==========================================================
     CADASTROS AUXILIARES
========================================================== -->

        <section class="cadastros-auxiliares">

            <div class="titulo-secao">

                <div>

                    <h2 id="tituloCadastrosAuxiliares">
                        Cadastros Auxiliares
                    </h2>

                    <p id="descricaoCadastrosAuxiliares">
                        Cadastre Marca, Categoria, Cor, Tamanho e Imagens individualmente.
                    </p>

                </div>

            </div>


            <div class="grid-cadastros">


                <!-- MARCA -->

                <article class="card-auxiliar">

                    <h3>Marca</h3>

                    <div class="campo">

                        <label for="marcaNome">
                            Nome
                        </label>

                        <input id="marcaNome" type="text" placeholder="Nome da Marca">

                    </div>


                    <div class="campo">

                        <label for="marcaLogo">
                            Logo
                        </label>

                        <input id="marcaLogo" type="file" accept="image/*">

                    </div>


                    <button id="btnSalvarMarca" type="button">

                        Salvar Marca

                    </button>

                </article>


                <!-- CATEGORIA -->

                <article class="card-auxiliar">

                    <h3>Categoria</h3>

                    <div class="campo">

                        <label for="categoriaNomeAux">
                            Nome Categoria
                        </label>

                        <input id="categoriaNomeAux" type="text" placeholder="Nome da Categoria">

                    </div>


                    <button id="btnSalvarCategoriaAux" type="button">

                        Salvar Categoria

                    </button>

                </article>


                <!-- COR -->

                <article class="card-auxiliar">

                    <h3>Cores</h3>

                    <div class="campo">

                        <label for="corNome">
                            Nome
                        </label>

                        <input id="corNome" type="text" placeholder="Nome da Cor">

                    </div>


                    <div class="campo">

                        <label for="codigoCor">
                            Código da Cor
                        </label>

                        <input id="codigoCor" type="color">

                    </div>


                    <button id="btnSalvarCor" type="button">

                        Salvar Cor

                    </button>

                </article>


                <!-- TAMANHO -->

                <article class="card-auxiliar">

                    <h3>Tamanho</h3>

                    <div class="campo">

                        <label for="nomeTamanhoAux">
                            Tamanho
                        </label>

                        <input id="nomeTamanhoAux" type="text" placeholder="Ex.: P, M, G, GG">

                    </div>


                    <button id="btnSalvarTamanho" type="button">

                        Salvar Tamanho

                    </button>

                </article>


                <!-- IMAGEM -->

                <article class="card-auxiliar card-imagem">

                    <h3>Imagem Produto</h3>

                    <div class="campo">

                        <label for="produtoImagemAux">
                            Produto
                        </label>

                        <select id="produtoImagemAux">

                            <option value="">
                                Selecione...
                            </option>

                        </select>

                    </div>


                    <div class="campo">

                        <label for="arquivoImagemAux">
                            Arquivo
                        </label>

                        <input id="arquivoImagemAux" type="file" accept="image/*">

                    </div>


                    <button id="btnSalvarImagem" type="button">

                        Salvar Imagem

                    </button>

                </article>

            </div>

        </section>


        <!-- ==========================================================
     ÚLTIMOS PRODUTOS
========================================================== -->

        <section class="produtos">

            <div class="titulo-secao">

                <h2 id="tituloProdutos"></h2>

                <p id="descricaoProdutos"></p>

            </div>


            <div class="grid-produtos">


                <article class="card-produto">

                    <img id="produtoImagem1" src="" alt="Produto">

                    <h3 id="produtoNome1"></h3>

                    <p id="produtoDescricao1"></p>

                    <span id="produtoPreco1"></span>

                    <span id="produtoEstoque1"></span>

                    <div class="acoes-card">

                        <button id="btnEditarProduto1"></button>

                        <button id="btnExcluirProduto1"></button>

                        <button id="btnVisualizarProduto1"></button>

                    </div>

                </article>


                <article class="card-produto">

                    <img id="produtoImagem2" src="" alt="Produto">

                    <h3 id="produtoNome2"></h3>

                    <p id="produtoDescricao2"></p>

                    <span id="produtoPreco2"></span>

                    <span id="produtoEstoque2"></span>

                    <div class="acoes-card">

                        <button id="btnEditarProduto2"></button>

                        <button id="btnExcluirProduto2"></button>

                        <button id="btnVisualizarProduto2"></button>

                    </div>

                </article>


                <article class="card-produto">

                    <img id="produtoImagem3" src="" alt="Produto">

                    <h3 id="produtoNome3"></h3>

                    <p id="produtoDescricao3"></p>

                    <span id="produtoPreco3"></span>

                    <span id="produtoEstoque3"></span>

                    <div class="acoes-card">

                        <button id="btnEditarProduto3"></button>

                        <button id="btnExcluirProduto3"></button>

                        <button id="btnVisualizarProduto3"></button>

                    </div>

                </article>


                <article class="card-produto">

                    <img id="produtoImagem4" src="" alt="Produto">

                    <h3 id="produtoNome4"></h3>

                    <p id="produtoDescricao4"></p>

                    <span id="produtoPreco4"></span>

                    <span id="produtoEstoque4"></span>

                    <div class="acoes-card">

                        <button id="btnEditarProduto4"></button>

                        <button id="btnExcluirProduto4"></button>

                        <button id="btnVisualizarProduto4"></button>

                    </div>

                </article>


                <article class="card-produto">

                    <img id="produtoImagem5" src="" alt="Produto">

                    <h3 id="produtoNome5"></h3>

                    <p id="produtoDescricao5"></p>

                    <span id="produtoPreco5"></span>

                    <span id="produtoEstoque5"></span>

                    <div class="acoes-card">

                        <button id="btnEditarProduto5"></button>

                        <button id="btnExcluirProduto5"></button>

                        <button id="btnVisualizarProduto5"></button>

                    </div>

                </article>


                <article class="card-produto">

                    <img id="produtoImagem6" src="" alt="Produto">

                    <h3 id="produtoNome6"></h3>

                    <p id="produtoDescricao6"></p>

                    <span id="produtoPreco6"></span>

                    <span id="produtoEstoque6"></span>

                    <div class="acoes-card">

                        <button id="btnEditarProduto6"></button>

                        <button id="btnExcluirProduto6"></button>

                        <button id="btnVisualizarProduto6"></button>

                    </div>

                </article>

            </div>

        </section>


        <!-- ==========================================================
     CADASTRO DE BANNER
========================================================== -->

        <section class="cadastro-banner">

            <div class="titulo-secao">

                <div>

                    <h2 id="tituloBanner"></h2>

                    <p id="descricaoBanner"></p>

                </div>

                <img id="imagemBanner" src="" alt="Banner">

            </div>


            <form id="formBanner">

                <div class="grid-form">


                    <div class="campo">

                        <label id="lblTituloBanner" for="tituloBannerInput">
                        </label>

                        <input id="tituloBannerInput" type="text">

                    </div>


                    <div class="campo">

                        <label id="lblTipoBanner" for="tipoBanner">
                        </label>

                        <select id="tipoBanner">

                            <option value=""></option>

                        </select>

                    </div>


                    <div class="campo">

                        <label id="lblImagemBanner" for="arquivoBanner">
                        </label>

                        <input id="arquivoBanner" type="file" accept="image/*">

                    </div>


                    <div class="campo">

                        <label id="lblTextoPrincipal" for="textoPrincipal">
                        </label>

                        <input id="textoPrincipal" type="text">

                    </div>


                    <div class="campo">

                        <label id="lblTextoSecundario" for="textoSecundario">
                        </label>

                        <input id="textoSecundario" type="text">

                    </div>


                    <div class="campo">

                        <label id="lblLinkBanner" for="linkBanner">
                        </label>

                        <input id="linkBanner" type="url">

                    </div>

                </div>


                <div class="acoes-formulario">

                    <button id="btnPreviewBanner" type="button">
                    </button>

                    <button id="btnSalvarBanner" type="submit">
                    </button>

                </div>

            </form>

        </section>


        <!-- ==========================================================
     BANNERS E CAMPANHAS
========================================================== -->

        <section class="banners">

            <div class="titulo-secao">

                <h2 id="tituloCampanhas"></h2>

                <p id="descricaoCampanhas"></p>

            </div>


            <div class="grid-banners">


                <article class="card-banner">

                    <img id="bannerImagem1" src="" alt="Banner">

                    <div class="banner-info">

                        <h3 id="bannerTitulo1"></h3>

                        <p id="bannerDescricao1"></p>

                        <span id="bannerStatus1"></span>

                    </div>

                    <div class="acoes-card">

                        <button id="btnEditarBanner1"></button>

                        <button id="btnExcluirBanner1"></button>

                        <button id="btnVisualizarBanner1"></button>

                    </div>

                </article>


                <article class="card-banner">

                    <img id="bannerImagem2" src="" alt="Banner">

                    <div class="banner-info">

                        <h3 id="bannerTitulo2"></h3>

                        <p id="bannerDescricao2"></p>

                        <span id="bannerStatus2"></span>

                    </div>

                    <div class="acoes-card">

                        <button id="btnEditarBanner2"></button>

                        <button id="btnExcluirBanner2"></button>

                        <button id="btnVisualizarBanner2"></button>

                    </div>

                </article>

            </div>

        </section>


        <!-- ==========================================================
     PROMOÇÕES CADASTRADAS
========================================================== -->

        <section class="promocoes">

            <div class="titulo-secao">

                <h2 id="tituloPromocoes"></h2>

                <p id="descricaoPromocoes"></p>

            </div>


            <div class="grid-status">

                <article class="status-card">

                    <img id="statusImagem1" src="" alt="Promoção">

                    <h3 id="statusTitulo1"></h3>

                    <p id="statusDescricao1"></p>

                    <span id="statusSituacao1"></span>

                </article>


                <article class="status-card">

                    <img id="statusImagem2" src="" alt="Promoção">

                    <h3 id="statusTitulo2"></h3>

                    <p id="statusDescricao2"></p>

                    <span id="statusSituacao2"></span>

                </article>


                <article class="status-card">

                    <img id="statusImagem3" src="" alt="Promoção">

                    <h3 id="statusTitulo3"></h3>

                    <p id="statusDescricao3"></p>

                    <span id="statusSituacao3"></span>

                </article>


                <article class="status-card">

                    <img id="statusImagem4" src="" alt="Promoção">

                    <h3 id="statusTitulo4"></h3>

                    <p id="statusDescricao4"></p>

                    <span id="statusSituacao4"></span>

                </article>

            </div>

        </section>


        <!-- ==========================================================
     CADASTRO DE PROMOÇÃO
========================================================== -->

        <section class="cadastro-promocao">

            <div class="titulo-secao">

                <div>

                    <h2 id="tituloCadastroPromocao"></h2>

                    <p id="descricaoCadastroPromocao"></p>

                </div>

                <img id="imagemPromocao" src="" alt="Promoção">

            </div>


            <form id="formPromocao">

                <div class="grid-form">


                    <div class="campo">

                        <label id="lblNomePromocao" for="nomePromocao">
                        </label>

                        <input id="nomePromocao" type="text">

                    </div>


                    <div class="campo">

                        <label id="lblTipoDesconto" for="tipoDesconto">
                        </label>

                        <select id="tipoDesconto">

                            <option value=""></option>

                        </select>

                    </div>


                    <div class="campo">

                        <label id="lblValorDesconto" for="valorDesconto">
                        </label>

                        <input id="valorDesconto" type="number">

                    </div>


                    <div class="campo">

                        <label id="lblInicioPromocao" for="inicioPromocao">
                        </label>

                        <input id="inicioPromocao" type="datetime-local">

                    </div>


                    <div class="campo">

                        <label id="lblFimPromocao" for="fimPromocao">
                        </label>

                        <input id="fimPromocao" type="datetime-local">

                    </div>


                    <div class="campo">

                        <label id="lblAplicarEm" for="aplicarEm">
                        </label>

                        <select id="aplicarEm">

                            <option value=""></option>

                        </select>

                    </div>

                </div>


                <div class="acoes-formulario">

                    <button id="btnSalvarRascunhoPromocao" type="button">
                    </button>

                    <button id="btnSalvarPromocao" type="submit">
                    </button>

                </div>

            </form>

        </section>


        <!-- ==========================================================
     RESUMO
========================================================== -->

        <section class="resumo-conteudo">

            <div class="titulo-secao">

                <h2 id="tituloResumo"></h2>

                <p id="descricaoResumo"></p>

            </div>


            <div class="cards-resumo">

                <article class="card-resumo">

                    <h3 id="tituloResumoCard1"></h3>

                    <span id="valorResumoCard1"></span>

                    <small id="descricaoResumoCard1"></small>

                </article>


                <article class="card-resumo">

                    <h3 id="tituloResumoCard2"></h3>

                    <span id="valorResumoCard2"></span>

                    <small id="descricaoResumoCard2"></small>

                </article>


                <article class="card-resumo">

                    <h3 id="tituloResumoCard3"></h3>

                    <span id="valorResumoCard3"></span>

                    <small id="descricaoResumoCard3"></small>

                </article>

            </div>

        </section>


        <!-- ==========================================================
     GRÁFICO
========================================================== -->

        <section class="grafico-cadastros">

            <article class="grafico-card">

                <h3 id="tituloGrafico"></h3>

                <p id="descricaoGrafico"></p>

                <img id="imagemGrafico" src="" alt="Gráfico">

            </article>

        </section>


    </main>


    <!-- ==========================================================
     RODAPÉ
========================================================== -->

    <footer>

        <div class="footer-container">

            <div class="footer-coluna">

                <p id="footerDica"></p>

            </div>


            <div class="footer-coluna">

                <a id="footerProdutos" href="#"></a>

                •

                <a id="footerBanners" href="#"></a>

                •

                <a id="footerPromocoes" href="#"></a>

            </div>


            <div class="footer-coluna">

                <a id="footerAjuda" href="#"></a>

                •

                <a id="footerTermos" href="#"></a>

                •

                <a id="footerPrivacidade" href="#"></a>

            </div>


            <div class="footer-copy">

                <p id="footerCopyright"></p>

            </div>

        </div>

    </footer>


    <!-- ==========================================================
     JAVASCRIPT
========================================================== -->

    <script src="../js/painel_lojista2.js"></script>

</body>

</html>

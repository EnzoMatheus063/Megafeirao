<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <link rel="stylesheet"
          href="../Style/home.css">

</head>

<body>

<!-- ===================================================
                    HEADER
==================================================== -->

<header class="header">

    <div class="logo-area">

        <img
            id="logoImagem"
            src=""
            alt="Logo">

        <h1 id="logoTitulo"></h1>

    </div>

    <nav class="menu-superior">

        <a id="menuOfertaSemana" href="#"></a>

        <a id="menuOfertaDia" href="#"></a>

        <a id="menuCategorias" href="#"></a>

        <a id="menuContato" href="#"></a>

    </nav>

    <div class="pesquisa">

        <input
            id="campoPesquisa"
            type="search"
            placeholder="">

    </div>

</header>

<!-- ===================================================
                CONTEÚDO PRINCIPAL
==================================================== -->

<div class="container">

    <!-- ==========================================
                MENU LATERAL
    =========================================== -->

    <aside class="sidebar">

        <nav>

            <a id="menuInicio" href="#"></a>

            <a id="menuOfertas" href="#"></a>

            <a id="menuMaisVendidos" href="#"></a>

            <a id="menuCupons" href="#"></a>

            <a id="menuMinhaConta" href="#"></a>

        </nav>

    </aside>

    <!-- ==========================================
                    CONTEÚDO
    =========================================== -->

    <main>

        <!-- ==========================
                ÁREA DO USUÁRIO
        =========================== -->

        <section class="usuario">

            <div class="usuario-info">

                <img
                    id="fotoUsuario"
                    src=""
                    alt="Usuário">

                <div>

                    <h2 id="tituloUsuario"></h2>

                    <p id="descricaoUsuario"></p>

                </div>

            </div>

            <div class="usuario-botoes">

                <button
                    id="btnCriarConta"
                    type="button">
                </button>

                <button
                    id="btnEntrar"
                    type="button">
                </button>

            </div>

        </section>

        <!-- ==========================
                BANNER
        =========================== -->

        <section class="banner">

            <div class="banner-texto">

                <h1 id="bannerTitulo"></h1>

                <p id="bannerDescricao"></p>

                <input
                    id="bannerPesquisa"
                    type="text"
                    placeholder="">

                <div class="banner-botoes">

                    <button
                        id="btnOfertaSemana"
                        type="button">
                    </button>

                    <button
                        id="btnOfertaDia"
                        type="button">
                    </button>

                </div>

            </div>

            <div class="banner-imagem">

                <img
                    id="imagemBanner"
                    src=""
                    alt="Banner">

            </div>

        </section>

        <!-- ==========================
                CATEGORIAS
        =========================== -->

        <section class="categorias">

            <div class="titulo-secao">

                <h2 id="tituloCategorias"></h2>

                <button
                    id="btnCategorias"
                    type="button">
                </button>

            </div>

            <p id="descricaoCategorias"></p>

            <div class="categorias-grid">

                <article class="categoria-card">

                    <img id="categoriaImagem1" src="" alt="">

                    <h3 id="categoriaTitulo1"></h3>

                    <p id="categoriaDescricao1"></p>

                </article>

                <article class="categoria-card">

                    <img id="categoriaImagem2" src="" alt="">

                    <h3 id="categoriaTitulo2"></h3>

                    <p id="categoriaDescricao2"></p>

                </article>

                <article class="categoria-card">

                    <img id="categoriaImagem3" src="" alt="">

                    <h3 id="categoriaTitulo3"></h3>

                    <p id="categoriaDescricao3"></p>

                </article>

            </div>

        </section>

        <!-- ==========================
                OFERTAS DO DIA
        =========================== -->

        <section class="ofertas-dia">

            <div class="titulo-secao">

                <h2 id="tituloOfertasDia"></h2>

                <p id="descricaoOfertasDia"></p>

            </div>

            <div class="produtos-grid">

                <article class="produto-card">

                    <img id="produtoImagem1" src="" alt="">

                    <h3 id="produtoTitulo1"></h3>

                    <p id="produtoPreco1"></p>

                </article>

                <article class="produto-card">

                    <img id="produtoImagem2" src="" alt="">

                    <h3 id="produtoTitulo2"></h3>

                    <p id="produtoPreco2"></p>

                </article>

                <article class="produto-card">

                    <img id="produtoImagem3" src="" alt="">

                    <h3 id="produtoTitulo3"></h3>

                    <p id="produtoPreco3"></p>

                </article>

                <article class="produto-card">

                    <img id="produtoImagem4" src="" alt="">

                    <h3 id="produtoTitulo4"></h3>

                    <p id="produtoPreco4"></p>

                </article>

            </div>

        </section>
                    <!-- ==========================================
                    OFERTAS DO DIA
            =========================================== -->

            <section class="ofertas-dia">

                <div class="titulo-secao">

                    <h2 id="tituloOfertasDia"></h2>

                    <p id="descricaoOfertasDia"></p>

                </div>

                <div class="produtos-grid">

                    <!-- Produto 1 -->

                    
                    </article>

                </div>

            </section>

            <!-- ==========================================
                    PROMOÇÕES DA SEMANA
            =========================================== -->

            <section class="promocoes-semana">

                <div class="titulo-secao">

                    <h2 id="tituloPromocoes"></h2>

                    <p id="descricaoPromocoes"></p>

                </div>

                <button
                    id="btnPromocoes"
                    type="button">
                </button>

                <div class="produtos-grid">

                    <!-- Produto 5 -->

                    <article class="produto-card">

                        <img
                            id="produtoImagem5"
                            src=""
                            alt="Produto">

                        <h3 id="produtoTitulo5"></h3>

                        <p id="produtoPreco5"></p>

                    </article>

                    <!-- Produto 6 -->

                    <article class="produto-card">

                        <img
                            id="produtoImagem6"
                            src=""
                            alt="Produto">

                        <h3 id="produtoTitulo6"></h3>

                        <p id="produtoPreco6"></p>

                    </article>

                    <!-- Produto 7 -->

                    <article class="produto-card">

                        <img
                            id="produtoImagem7"
                            src=""
                            alt="Produto">

                        <h3 id="produtoTitulo7"></h3>

                        <p id="produtoPreco7"></p>

                    </article>

                    <!-- Produto 8 -->

                    <article class="produto-card">

                        <img
                            id="produtoImagem8"
                            src=""
                            alt="Produto">

                        <h3 id="produtoTitulo8"></h3>

                        <p id="produtoPreco8"></p>

                    </article>

                </div>

            </section>

        </main>

    </div>

    <!-- ==========================================
                    FOOTER
    =========================================== -->

    <footer>

        <div class="footer-container">

            <div class="footer-redes">

                <h3 id="tituloRedes"></h3>

                <div class="redes">

                    <a id="facebook" href="#">
                        <img id="iconeFacebook" src="" alt="Facebook">
                    </a>

                    <a id="instagram" href="#">
                        <img id="iconeInstagram" src="" alt="Instagram">
                    </a>

                    <a id="tiktok" href="#">
                        <img id="iconeTikTok" src="" alt="TikTok">
                    </a>

                    <a id="linkedin" href="#">
                        <img id="iconeLinkedin" src="" alt="LinkedIn">
                    </a>

                    <a id="whatsapp" href="#">
                        <img id="iconeWhatsapp" src="" alt="WhatsApp">
                    </a>

                </div>

            </div>

            <div class="footer-endereco">

                <h3 id="tituloEndereco"></h3>

                <p id="textoEndereco"></p>

            </div>

        </div>

        <div class="footer-links">

            <a id="footerAtendimento" href="#"></a>

            <a id="footerTroca" href="#"></a>

            <a id="footerFrete" href="#"></a>

            <a id="footerPagamento" href="#"></a>

        </div>

        <div class="footer-copy">

            <p id="copyright"></p>

        </div>

    </footer>

    <script src="../js/home.js"></script>

</body>

</html>
